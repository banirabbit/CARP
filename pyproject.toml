[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carp-routing"
version = "0.1.0"
description = "Query-aware QoS routing for LLM-orchestrated services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.6",
  "torch>=2.5",
  "transformers>=4.53",
  "tqdm>=4.67",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]
