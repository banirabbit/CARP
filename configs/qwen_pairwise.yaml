# 成对学习配置
# 基于 qwen_base.yaml，针对 Pairwise Learning 优化

model:
  model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  num_methods: 6
  method_vocab: ["dalk", "gr", "hippo", "lgraph", "light", "qagn"]
  use_method_embedding: false
  method_embedding_scale: 1.0
  method_embedding_init_std: 0.02
  pooling_mode: "mean"  # 推荐: 'mean' 或 'last'（对decoder-only模型更好）
  dropout: 0.1
  use_gradient_checkpointing: true
  max_length: 256  # 降低序列长度节省显存
  
  # 防止塌缩策略（统一 Pairwise 架构）
  temperature: 1.8  # 温度参数 T（1.5-3.0），平滑logits防止塌缩
  learnable_temperature: false  # 是否可学习（建议false，用退火）
  margin: 0.2  # 边际参数 γ（0.1-0.3），要求"赢得足够多才算赢"
  
  # 损失函数: Bradley-Terry Pairwise Loss (模型内部计算)
  # L = log(1 + exp(-y * (sA - sB - margin) / T))
  # 其中 y ∈ {+1, -1}, sA/sB 是方法A/B的分数，T是温度，margin是边际
  pairwise_weight: 1.0
  pointwise_weight: 0.0
  pointwise_loss_type: "huber"
  pointwise_huber_beta: 0.1
  pointwise_apply_sigmoid: true

training:
  # 数据文件（使用成对数据）
  train_file: "dataset/pairwise/train_pairwise.csv"
  val_file: "dataset/pairwise/val_pairwise.csv"
  test_file: "dataset/pairwise/test_pairwise.csv"
  
  # 批量设置
  batch_size_q: 4  # 每批问题数量（每题约4对）
  num_methods: 6
  gradient_accumulation_steps: 4  # 梯度累积
  
  # 训练超参数
  num_epochs: 10
  learning_rate: 2.4e-5  # 比原来高1.2倍（pairwise梯度更稠密）
  weight_decay: 0.01
  warmup_ratio: 0.05  # 5% warmup（用户建议）
  max_grad_norm: 0.8  # 梯度裁剪 0.5-1.0（防止塌缩）
  
  # 防止塌缩策略
  freeze_backbone_epochs: 0  # 禁用分阶段训练，从一开始就训练全模型
  temperature_schedule: "linear"  # 温度退火: linear, cosine, null
  
  # 优化器
  optimizer_type: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  
  # 学习率调度
  scheduler_type: "cosine"  # cosine decay（更平滑）
  
  # 评估和保存
  eval_steps: 500
  save_steps: 1
  logging_steps: 50
  
  # 输出
  output_dir: "outputs/pairwise"
  
  # 分布式训练
  use_ddp: false  # 使用 DeepSpeed 时设为 false
  
  # 混合精度
  fp16: false
  bf16: true  # 使用 bf16（与原项目一致）
  
  # 指标
  metric_for_best_model: "loss"
  greater_is_better: false  # loss 越小越好

  # 平均 F1 先验权重（用于评估和推理）
  # final_score = model_score + f1_prior_alpha * avg_f1(method)
  # 建议值: [0.0, 0.2, 0.5, 1.0]，在验证集上调优
  f1_prior_alpha: 0.5

  # baseline-aware / tie-aware checkpoint 选择
  # opp(q) = oracle(q) - F1(q, strongest_single_method)
  # hard case: opp(q) >= checkpoint_opportunity_threshold
  checkpoint_opportunity_threshold: 0.05
  checkpoint_overall_gain_floor: -0.005
  checkpoint_easy_regret_ceiling: 0.01

  # 其他
  seed: 42
  num_workers: 4
  pin_memory: true
  
  # 成对学习特定参数
  use_class_weights: true  # 是否使用类权重
  weight_type: "sqrt_inverse"  # 权重类型: inverse, sqrt_inverse, log_inverse
  use_pair_score_weights: false
  pair_score_weight_floor: 0.25
  pair_score_weight_power: 1.0
  tied_best_weight: 1.0
  num_best_methods_weight_power: 0.0
